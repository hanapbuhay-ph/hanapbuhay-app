<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center">
<div class="w-full max-w-container-max mx-auto h-full flex flex-col relative min-h-screen">
<!-- TopAppBar (Transactional - Hidden Navigation Shell, keeping simple top bar) -->
<header class="sticky top-0 w-full bg-surface/90 backdrop-blur-md shadow-sm z-50 flex items-center px-margin-mobile md:px-margin-desktop h-16 shrink-0 transition-shadow">
<button aria-label="Go back" class="text-on-surface-variant hover:bg-surface-variant/50 p-2 rounded-full transition-colors active:scale-95 duration-100 flex items-center justify-center mr-4">
<span class="material-symbols-outlined" data-icon="arrow_back" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile text-on-surface tracking-tight truncate flex-1 text-center pr-10">Verification</h1>
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop w-full relative z-10 gap-8">
<!-- Status Card -->
<div class="bg-surface-container-lowest rounded-[24px] shadow-[0_8px_32px_rgba(52,168,53,0.06)] p-8 md:p-12 w-full max-w-md flex flex-col items-center text-center gap-6 border border-surface-container-high/50 transform transition-all duration-300 hover:shadow-[0_12px_48px_rgba(52,168,53,0.08)] hover:-translate-y-1 relative overflow-hidden group">
<!-- Ambient Glow effect -->
<div class="absolute inset-0 bg-gradient-to-b from-tertiary-fixed/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-700 pointer-events-none"></div>
<div class="bg-tertiary-container/10 p-6 rounded-full inline-flex items-center justify-center relative shadow-inner">
<!-- Subtle pulsing ring behind icon -->
<div class="absolute inset-0 bg-tertiary-container/20 rounded-full animate-ping opacity-50"></div>
<span class="material-symbols-outlined text-[64px] text-tertiary-container drop-shadow-sm z-10" data-icon="pending_actions" data-weight="fill" style="font-variation-settings: 'FILL' 1;">pending_actions</span>
</div>
<div class="flex flex-col gap-3 relative z-10">
<h2 class="font-headline-md text-headline-md text-on-surface tracking-tight">Documents Under Review</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Your documents are currently being processed. This usually takes <span class="font-bold text-on-surface">1–3 business days</span>.</p>
</div>
<div class="bg-surface-container p-4 rounded-xl w-full border border-surface-variant/50 relative z-10 flex items-start gap-3 text-left">
<span class="material-symbols-outlined text-primary mt-0.5 shrink-0" data-icon="info">info</span>
<p class="font-body-md text-body-md text-on-surface-variant">We'll notify you once your verification is complete. In the meantime, you can still explore the app.</p>
</div>
</div>
</main>
<!-- Bottom Fixed Button Area -->
<div class="w-full p-margin-mobile md:p-margin-desktop bg-gradient-to-t from-background via-background/90 to-transparent sticky bottom-0 z-20 flex justify-center pb-8 shrink-0">
<div class="w-full max-w-md">
<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg py-4 px-6 rounded-full shadow-[0_4px_12px_rgba(52,168,53,0.25)] hover:shadow-[0_6px_16px_rgba(52,168,53,0.35)] transition-all active:scale-95 duration-100 flex items-center justify-center gap-2 border-t border-white/20">
<span>Back to Home</span>
<span class="material-symbols-outlined" data-icon="home">home</span>
</button>
</div>
</div>
