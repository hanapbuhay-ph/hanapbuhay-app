<body class="bg-surface-cream text-on-surface font-body-md antialiased h-screen flex flex-col">
<!-- TopAppBar from JSON -->
<header class="sticky top-0 w-full z-50 bg-surface/90 backdrop-blur-md shadow-sm dark:shadow-none flex items-center justify-between px-margin-mobile h-16 transition-colors">
<button class="text-primary dark:text-primary-fixed hover:bg-surface-variant/50 transition-colors active:scale-95 duration-100 rounded-full p-2 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="chevron_left">chevron_left</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile text-on-surface font-bold">Security Settings</h1>
<button class="text-primary dark:text-primary-fixed hover:bg-surface-variant/50 transition-colors active:scale-95 duration-100 rounded-full p-2 flex items-center justify-center opacity-0 pointer-events-none">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</header>
<main class="flex-1 overflow-y-auto px-margin-mobile py-6 max-w-container-max mx-auto w-full md:px-margin-desktop md:py-12">
<div class="max-w-2xl mx-auto space-y-6">
<div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_12px_rgba(52,168,53,0.08)] overflow-hidden">
<div class="divide-y divide-surface-variant">
<!-- Row 1: Change Password -->
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors group">
<div class="flex flex-col items-start">
<span class="font-body-lg text-body-lg text-on-surface group-hover:text-primary transition-colors">Change Password</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">chevron_right</span>
</button>
<!-- Row 2: Linked Accounts -->
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors group">
<div class="flex flex-col items-start">
<span class="font-body-lg text-body-lg text-on-surface group-hover:text-primary transition-colors">Linked Accounts</span>
<span class="font-body-md text-body-md text-on-surface-variant text-sm mt-1">Google account linked: user@email.com</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">chevron_right</span>
</button>
<!-- Row 3: Two-Factor Authentication -->
<div class="w-full flex items-center justify-between p-4">
<div class="flex flex-col items-start">
<span class="font-body-lg text-body-lg text-on-surface">Two-Factor Authentication</span>
<span class="font-body-md text-body-md text-on-surface-variant text-sm mt-1">Add an extra layer of security to your account.</span>
</div>
<!-- Custom Switch -->
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value="">
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-container"></div>
</label>
</div>
<!-- Row 4: Login Activity -->
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors group">
<div class="flex flex-col items-start">
<span class="font-body-lg text-body-lg text-on-surface group-hover:text-primary transition-colors">Login Activity</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">chevron_right</span>
</button>
</div>
</div>
<div class="pt-6">
<button class="w-full bg-surface-container-lowest text-error font-label-lg text-label-lg py-4 rounded-xl shadow-[0_4px_12px_rgba(186,26,26,0.08)] hover:bg-error-container transition-colors border border-error-container">
                    Sign Out of All Devices
                </button>
</div>
</div>
