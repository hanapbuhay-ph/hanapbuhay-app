<div class="w-full max-w-md bg-white rounded-xl shadow-[0_4px_30px_rgba(52,168,53,0.08)] p-8">

</div>
<!-- Middle: Form Area -->
<div class="space-y-6">
<!-- Google Login -->
<button class="w-full flex items-center justify-center gap-3 py-3 px-4 bg-white border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors duration-200">

<span class="flex-shrink-0 mx-4 font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">or</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Form Fields -->
<form action="#" class="space-y-4" method="POST">
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-1" for="identifier">Email or Mobile Number</label>
<input class="w-full px-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-colors font-body-md text-body-md text-on-surface" id="identifier" name="identifier" placeholder="Enter your email or mobile" type="text">
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-1" for="password">Password</label>
<div class="relative">
<input class="w-full px-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-colors font-body-md text-body-md text-on-surface pr-12" id="password" name="password" placeholder="Enter your password" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="flex justify-end">
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<button class="w-full py-3 px-4 bg-primary-container text-on-primary-container rounded-lg font-label-lg text-label-lg btn-primary hover:bg-leaf-bright transition-all duration-200 shadow-md" type="submit">

                </button>

</div>

<p class="font-body-md text-body-md text-on-surface-variant">
