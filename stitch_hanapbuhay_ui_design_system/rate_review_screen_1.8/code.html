        .star-rating .material-symbols-outlined.filled { font-variation-settings: 'FILL' 1; color: #ffb957; }

<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center">
<!-- TopAppBar -->
<header class="sticky top-0 w-full z-50 bg-surface/90 backdrop-blur-md shadow-sm dark:shadow-none transition-colors">
<div class="flex items-center justify-between px-margin-mobile h-16 w-full max-w-container-max mx-auto">
<button class="text-primary dark:text-primary-fixed hover:bg-surface-variant/50 transition-colors p-2 rounded-full active:scale-95 duration-100 flex items-center justify-center">
<span class="material-symbols-outlined">chevron_left</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile md:text-headline-md text-primary dark:text-primary-fixed tracking-tight font-bold">HanapBuhay</h1>
<button class="text-primary dark:text-primary-fixed hover:bg-surface-variant/50 transition-colors p-2 rounded-full active:scale-95 duration-100 flex items-center justify-center invisible">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
</header>
<main class="flex-1 w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop py-8 md:py-12 flex flex-col items-center justify-center max-w-md">
<!-- Header Text -->
<div class="text-center mb-8">
<h2 class="font-headline-md text-headline-md mb-2 text-on-surface">Rate Your Experience</h2>
<p class="font-body-md text-body-md text-on-surface-variant">How was the service provided by Ricardo?</p>
</div>
<!-- Worker Summary Card -->
<div class="bg-surface-container-lowest rounded-xl p-6 w-full shadow-[0_4px_12px_rgba(52,168,53,0.08)] mb-8 flex flex-col items-center">
<div class="w-24 h-24 rounded-full overflow-hidden mb-4 border-4 border-surface-container-low shadow-sm">
<img alt="Ricardo Dalisay" class="w-full h-full object-cover" data-alt="A portrait of a friendly male master plumber wearing a clean, green uniform shirt. He has a warm smile and is set against a brightly lit, modern indoor background. The lighting is soft and flattering, highlighting the approachable and reliable nature of the digital naturalist brand aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCaAOU8Yi20TKy5CE-Oux3OhUWyExDJluiYcE45Reb2EeuewYYHZl7sYGp8z3LHVYOdCMGW4aW9SfeNRhGwziU-ag0A1nJVEnvDP7TlMreH0CNNcULixQ8jmC4Uz3pk29RtvdfKtFLZX1YB0W_0j13uBojppv56ihOLHsQDDn_2jkLBx3iJ1rdDM8uZkrr4_s_r_a5Y0G9IlhHSnhSf5I7Oglu2lSJWYnds4PkmN1dkPohNFZ4XTBs4RQ"/>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-1">Ricardo Dalisay</h3>
<span class="bg-primary-container/10 text-on-secondary-container px-3 py-1 rounded-full font-label-sm text-label-sm uppercase tracking-wider font-semibold">Master Plumber</span>
</div>
<!-- Rating Form -->
<form class="w-full flex flex-col gap-8" id="rating-form" onsubmit="event.preventDefault(); submitReview();">
<!-- Star Selector -->
<div class="flex flex-col items-center gap-4">
<label class="font-label-lg text-label-lg text-on-surface text-center w-full">Select Rating</label>
<div class="flex gap-2 star-rating" id="star-container">
<span class="material-symbols-outlined text-4xl md:text-5xl text-outline-variant" data-value="1" onclick="setRating(1)">star</span>
<span class="material-symbols-outlined text-4xl md:text-5xl text-outline-variant" data-value="2" onclick="setRating(2)">star</span>
<span class="material-symbols-outlined text-4xl md:text-5xl text-outline-variant" data-value="3" onclick="setRating(3)">star</span>
<span class="material-symbols-outlined text-4xl md:text-5xl text-outline-variant" data-value="4" onclick="setRating(4)">star</span>
<span class="material-symbols-outlined text-4xl md:text-5xl text-outline-variant" data-value="5" onclick="setRating(5)">star</span>
</div>
<input id="rating-value" name="rating" required="" type="hidden" value="0"/>
</div>
<!-- Written Review -->
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface" for="review-text">Write a Review</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg p-4 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all resize-none" id="review-text" name="review" placeholder="Tell us about your experience..." required="" rows="5"></textarea>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg py-4 rounded-full shadow-[0_4px_12px_rgba(52,168,53,0.2)] hover:shadow-[0_6px_16px_rgba(52,168,53,0.3)] hover:-translate-y-0.5 active:translate-y-px active:shadow-sm transition-all duration-200 border-b-2 border-surface-tint" type="submit">
                Submit Review
            </button>
</form>
</main>
<script>
        function setRating(value) {
            document.getElementById('rating-value').value = value;
            const stars = document.querySelectorAll('#star-container .material-symbols-outlined');
            stars.forEach((star, index) => {
                if (index < value) {
                    star.classList.add('filled');
                    star.classList.remove('text-outline-variant');
                } else {
                    star.classList.remove('filled');
                    star.classList.add('text-outline-variant');
                }
            });
        }

        // Initialize with hover effects for better UX
        const starContainer = document.getElementById('star-container');
        const stars = Array.from(starContainer.children);

        stars.forEach((star, index) => {
            star.addEventListener('mouseover', () => {
                const currentValue = parseInt(document.getElementById('rating-value').value);
                if (currentValue === 0) {
                     stars.forEach((s, i) => {
                        if (i <= index) {
                            s.classList.add('text-tertiary-fixed-dim');
                            s.style.fontVariationSettings = "'FILL' 1";
                        } else {
                             s.classList.remove('text-tertiary-fixed-dim');
                             s.style.fontVariationSettings = "'FILL' 0";
                        }
                    });
                }
            });

            star.addEventListener('mouseout', () => {
                const currentValue = parseInt(document.getElementById('rating-value').value);
                if (currentValue === 0) {
                     stars.forEach((s) => {
                        s.classList.remove('text-tertiary-fixed-dim');
                        s.style.fontVariationSettings = "'FILL' 0";
                    });
                } else {
                    setRating(currentValue); // Reset to selected state
                }
            });
        });

        function submitReview() {
            const rating = document.getElementById('rating-value').value;
            if (rating == 0) {
                alert("Please select a star rating.");
                return;
            }
            const btn = document.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin align-middle mr-2">progress_activity</span> Submitting...';
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            
            // Simulate submission
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined align-middle mr-2">check_circle</span> Review Submitted';
                btn.classList.remove('bg-primary', 'hover:-translate-y-0.5');
                btn.classList.add('bg-leaf-bright');
                
                setTimeout(() => {
                    // Reset or redirect
                    // btn.innerHTML = originalText;
                    // btn.classList.remove('bg-leaf-bright', 'opacity-80', 'cursor-not-allowed');
                    // btn.classList.add('bg-primary', 'hover:-translate-y-0.5');
                    // document.getElementById('rating-form').reset();
                    // setRating(0);
                }, 2000);
            }, 1500);
        }
    </script>
