<style>
        /* Custom overrides or specific additions if needed beyond Tailwind config */
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .role-card {
            transition: all 0.2s ease-in-out;
        }
        
        .role-card.active {
            border-color: #34a835; /* Primary Green */
            background-color: rgba(52, 168, 53, 0.05);
            box-shadow: 0 4px 12px rgba(52, 168, 53, 0.1);
        }
        
        .role-card.active .check-icon {
            opacity: 1;
            transform: scale(1);
        }
        
        .check-icon {
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.2s ease-in-out;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop font-body-lg text-on-surface">
<main class="w-full max-w-md mx-auto flex flex-col bg-surface-cream rounded-xl shadow-[0_8px_30px_rgba(52,168,53,0.08)] overflow-hidden relative">
<!-- Top App Bar equivalent for onboarding flow -->
<header class="w-full flex justify-center py-6 border-b border-surface-container-low relative">
<button aria-label="Go back" class="absolute left-6 top-1/2 transform -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">HanapBuhay</h1>
</header>
<div class="flex-1 flex flex-col p-6 space-y-8">
<div class="text-center space-y-2">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">
                    How will you use HanapBuhay?
                </h2>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Select your primary role to customize your experience.
                </p>
</div>
<!-- Selection Area -->
<div class="flex flex-col gap-4">
<!-- Client Role Card -->
<button class="role-card relative w-full flex items-center p-6 bg-surface border-2 border-outline-variant rounded-lg text-left group hover:border-primary-container/50 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" id="card-client" onclick="selectRole('client')" type="button">
<div class="w-12 h-12 flex-shrink-0 bg-secondary-container rounded-full flex items-center justify-center mr-4 text-on-secondary-container">
<span class="material-symbols-outlined text-[28px]">search</span>
</div>
<div class="flex-1">
<h3 class="font-headline-md text-headline-md text-on-surface mb-1">I want to hire</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Find skilled workers for your tasks and projects.</p>
</div>
<div class="check-icon absolute top-4 right-4 w-6 h-6 bg-primary-container rounded-full flex items-center justify-center text-on-primary-container">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
<!-- Worker Role Card -->
<button class="role-card relative w-full flex items-center p-6 bg-surface border-2 border-outline-variant rounded-lg text-left group hover:border-primary-container/50 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" id="card-worker" onclick="selectRole('worker')" type="button">
<div class="w-12 h-12 flex-shrink-0 bg-tertiary-container rounded-full flex items-center justify-center mr-4 text-on-primary">
<span class="material-symbols-outlined text-[28px]">build</span>
</div>
<div class="flex-1">
<h3 class="font-headline-md text-headline-md text-on-surface mb-1">I want to work</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Offer your skills and find job opportunities.</p>
</div>
<div class="check-icon absolute top-4 right-4 w-6 h-6 bg-primary-container rounded-full flex items-center justify-center text-on-primary-container">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
</div>
</div>
<!-- Footer -->
<div class="p-6 pt-0 mt-auto">
<button class="w-full py-4 px-6 bg-surface-variant text-on-surface-variant font-label-lg text-label-lg rounded-lg transition-all duration-200 cursor-not-allowed flex items-center justify-center gap-2" disabled="" id="continue-btn">
                Continue
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</main>
<script>
        let selectedRole = null;

        function selectRole(role) {
            selectedRole = role;
            
            // Reset all cards
            document.querySelectorAll('.role-card').forEach(card => {
                card.classList.remove('active');
            });
            
            // Activate selected card
            document.getElementById(`card-${role}`).classList.add('active');
            
            // Enable button
            const btn = document.getElementById('continue-btn');
            btn.disabled = false;
            btn.classList.remove('bg-surface-variant', 'text-on-surface-variant', 'cursor-not-allowed');
            btn.classList.add('bg-primary-container', 'text-on-primary-container', 'hover:shadow-[0_4px_12px_rgba(52,168,53,0.2)]', 'hover:-translate-y-[1px]', 'active:translate-y-0', 'cursor-pointer');
        }
    </script>
</body></html>
