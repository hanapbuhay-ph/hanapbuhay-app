<p class="font-body-lg text-body-lg text-on-surface-variant">Enter your email address or mobile number and we'll send you a code to reset your password.</p>

<div class="relative">

</div>
</div>
<!-- Spacer to push button to bottom -->
<div class="flex-1"></div>

<div class="pt-6 shrink-0 mt-auto">
<button class="w-full flex justify-center items-center py-4 px-6 border border-transparent rounded-lg shadow-[0_4px_12px_rgba(52,168,53,0.15)] font-label-lg text-label-lg text-on-primary bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-200 active:scale-[0.98] border-b-[3px] border-b-on-primary-fixed-variant/30 relative overflow-hidden group" type="submit">
