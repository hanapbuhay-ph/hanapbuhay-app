<body class="bg-background text-on-background min-h-screen font-body-md antialiased pb-32">
<!-- Top App Bar -->
<header class="sticky top-0 w-full z-50 glass-panel shadow-sm border-b-0">
<div class="flex items-center justify-between px-margin-mobile h-16 w-full z-50">
<button class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:bg-surface-variant/50 transition-colors rounded-full active:scale-95 duration-100">

</button>
<h1 class="font-headline-md text-headline-md-mobile text-primary tracking-tight">Send Request</h1>
<button class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:bg-surface-variant/50 transition-colors rounded-full active:scale-95 duration-100">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</div>
</header>
<main class="w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop py-6">
<!-- Worker Summary Card -->
<div class="bg-surface-container-lowest rounded-xl p-6 mb-6 soft-shadow flex items-center gap-4">
<img class="w-16 h-16 rounded-full object-cover shadow-sm" data-alt="A high-quality, friendly portrait photograph of a Filipino male plumber in his 40s. He is wearing a clean, green uniform polo shirt with a small tool belt visible. The background is a soft, blurred modern kitchen. The lighting is warm and natural, creating a welcoming, professional 'Modern-Tactile' aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBM2i8GkxBhsVKgVhRgELEyV1xiiGIil-V0l-yvfCyOS9r4Q5yxwJZD8EB9WcSqrQP0DazqnZQnGYUt_1nTd0NcDH8bvvq7dRC6QNXkfa_VjcKpeIX51nGlRa64AcMejISAkqiXoCSRV4XEq_6HZfJoAswzGBpUxxO6Sb7xpgzF7McO9s8NlfnHfZH6PA1BB_SU9FR4R5DOo0Sn_GsLTnYX7HG6YrxqYsD1rL-KqFaOIFMS7XaftahMhA"/>
<div>
<h2 class="font-headline-md text-headline-md-mobile text-on-surface">Ricardo Dalisay</h2>
<div class="flex items-center gap-1 text-on-surface-variant mt-1">
<span class="material-symbols-outlined text-tertiary text-sm" data-icon="star" data-weight="fill" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="font-label-sm text-label-sm">4.9 (120 reviews)</span>
</div>
</div>
</div>
<!-- Booking Form -->
<form class="space-y-6">
<!-- Service Category -->
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface" for="service-category">Service Required</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 appearance-none focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface" id="service-category">
<option selected="" value="plumbing">Plumbing</option>
<option value="electrical">Electrical</option>
<option value="carpentry">Carpentry</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Date & Time Row -->
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface" for="date">Date</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface" id="date" type="date"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none bg-surface-container-lowest pl-2" data-icon="calendar_today">calendar_today</span>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface" for="time">Time</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface" id="time" type="time"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none bg-surface-container-lowest pl-2" data-icon="schedule">schedule</span>
</div>
</div>
</div>
<!-- Service Address -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label-lg text-label-lg text-on-surface" for="address">Service Address</label>
<button class="flex items-center gap-1 text-primary hover:text-primary-container transition-colors font-label-sm text-label-sm" type="button">
<span class="material-symbols-outlined text-sm" data-icon="my_location">my_location</span>
                        Use current location
                    </button>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-3 text-on-surface-variant pointer-events-none" data-icon="location_on">location_on</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-12 pr-4 py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface" id="address" placeholder="Enter full address" type="text" value="123 Mabini St, Brgy. San Lorenzo, Makati"/>
</div>
</div>
<!-- Notes -->
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface" for="notes">Job Details</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface resize-none" id="notes" placeholder="Describe the issue... e.g. leaking pipe under kitchen sink" rows="4">leaking pipe under kitchen sink, water pooling on the floor.</textarea>
</div>
</form>
</main>

<div class="fixed bottom-0 left-0 w-full z-50 glass-panel shadow-[0_-4px_12px_rgba(0,0,0,0.05)] border-t-0 p-4">
