<body class="bg-surface-cream text-on-surface font-body-md min-h-screen flex flex-col">
<!-- Top Navigation (Transactional, no global nav shell) -->

</div>

</button>
<button aria-label="Rate 3 stars" class="p-1 hover:scale-110 active:scale-95 transition-transform duration-200 focus:outline-none">

<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg py-4 rounded-xl shadow-sm hover:shadow-md hover:bg-primary/90 active:translate-y-px active:shadow-inner transition-all duration-200 flex justify-center items-center">
                Submit Rating
            </button>

<script>
        // Simple Star Rating Logic
        document.addEventListener('DOMContentLoaded', () => {
            const stars = document.querySelectorAll('#rating-container button span');
            const ratingText = document.getElementById('rating-text');
            const feedbackTexts = ["Very Poor", "Poor", "Okay", "Good", "Excellent!"];
            let currentRating = 0;

            stars.forEach((starSpan, index) => {
                const button = starSpan.parentElement;
                
                button.addEventListener('click', () => {
                    currentRating = index + 1;
                    updateStars(currentRating);
                });

                button.addEventListener('mouseenter', () => {
                    updateStars(index + 1, true);
                });
            });

            document.getElementById('rating-container').addEventListener('mouseleave', () => {
                updateStars(currentRating);
            });

            function updateStars(rating, isHover = false) {
                stars.forEach((star, idx) => {
                    if (idx < rating) {
                        star.classList.add('filled');
                        star.classList.remove('text-surface-variant');
                        if (isHover && currentRating === 0) {
                             star.style.opacity = '0.7';
                        } else {
                             star.style.opacity = '1';
                        }
                    } else {
                        star.classList.remove('filled');
                        star.classList.add('text-surface-variant');
                        star.style.opacity = '1';
                    }
                });

                if (rating > 0) {
                    ratingText.textContent = feedbackTexts[rating - 1];
                } else {
                    ratingText.textContent = '';
                }
            }
        });
    </script>
